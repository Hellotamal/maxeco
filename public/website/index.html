<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxEco Energy & Tech | Clean Energy Advisory & Modern Digital Execution | Guwahati, Assam</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="MaxEco Energy & Tech provides commercial & residential rooftop solar EPC advisory, APDCL net-metering clearances, CEIG approvals, and high-performance IT infrastructure & web solutions across Guwahati and Northeast India.">
  <meta name="keywords" content="MaxEco Energy, Solar EPC Guwahati, APDCL Net Metering Assam, Solar Rooftop Guwahati, CEIG Clearance Assam, IT Infra Sales Guwahati, Northeast India Solar, Web Development Guwahati">
  <meta name="author" content="MaxEco Energy & Tech">
  
  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MaxEco Energy & Tech | Clean Energy Advisory & Digital Execution">
  <meta property="og:description" content="Practical Clean Energy Advisory & Digital Growth for Northeast India. Helping commercial enterprises & institutions reduce power bills with rooftop solar and expand digitally.">
  <meta property="og:image" content="../assets/logo-emblem.png">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MaxEco Energy & Tech — Guwahati, Assam">
  <meta name="twitter:description" content="Founder-led clean solar engineering and enterprise IT solutions across Northeast India.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/logo-emblem.png">
  <link rel="apple-touch-icon" href="../assets/logo-emblem.png">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel Standalone for In-Browser JSX Compilation -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Global Design System & CSS Custom Properties -->
  <style>
    /* ==========================================================================
       CSS CUSTOM PROPERTIES: DESIGN TOKENS (LIGHT & DARK MODES)
       ========================================================================== */
    :root {
      /* Brand Primary (Blue #3B82F6 as requested) */
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --primary-focus: rgba(59, 130, 246, 0.25);
      --primary-light: rgba(59, 130, 246, 0.1);
      
      /* Secondary & Brand Accents */
      --solar-amber: #F59E0B;
      --solar-amber-hover: #D97706;
      --eco-green: #10B981;
      --eco-green-hover: #059669;
      --sky-blue: #0284C7;
      
      /* Light Theme (Default) */
      --bg-body: #FFFFFF;
      --bg-surface: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F8FAFC;
      --bg-alt: #F1F5F9;
      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;
      
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      
      --nav-bg: rgba(255, 255, 255, 0.88);
      --nav-border: rgba(226, 232, 240, 0.8);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --glow-shadow: 0 0 25px rgba(59, 130, 246, 0.18);
      
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-heading: 'Outfit', 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-body: #0B1120;
      --bg-surface: #0F172A;
      --bg-card: #1E293B;
      --bg-card-hover: #243248;
      --bg-alt: #131D31;
      --border-color: #334155;
      --border-subtle: rgba(255, 255, 255, 0.08);
      
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-light: #64748B;
      
      --nav-bg: rgba(11, 17, 32, 0.88);
      --nav-border: rgba(51, 65, 85, 0.7);
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
      --card-shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --glow-shadow: 0 0 30px rgba(59, 130, 246, 0.28);
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      transition: background-color var(--transition-normal), color var(--transition-normal);
      max-width: 100vw;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Container Utility */
    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Spacious Section Spacing */
    .section-spacing {
      padding: 96px 0;
      position: relative;
    }

    @media (max-width: 768px) {
      .section-spacing {
        padding: 60px 0;
      }
      .container {
        padding: 0 16px;
      }
    }

    /* Typography Utilities */
    .font-heading {
      font-family: var(--font-heading);
    }
    .font-mono {
      font-family: var(--font-mono);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .badge-primary {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .badge-amber {
      background: rgba(245, 158, 11, 0.12);
      color: var(--solar-amber);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .badge-green {
      background: rgba(16, 185, 129, 0.12);
      color: var(--eco-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    /* Custom Interactive Cursor (Desktop Only) */
    .custom-cursor-dot, .custom-cursor-ring {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .custom-cursor-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
    }
    .custom-cursor-ring {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--primary);
      opacity: 0.5;
      transition: width 0.2s, height 0.2s, transform 0.15s ease-out, background-color 0.2s;
    }
    .cursor-hover .custom-cursor-ring {
      width: 54px;
      height: 54px;
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary-hover);
    }
    @media (hover: none) or (max-width: 992px) {
      .custom-cursor-dot, .custom-cursor-ring {
        display: none !important;
      }
    }

    /* Preloader Animation */
    #site-preloader {
      position: fixed;
      inset: 0;
      background: var(--bg-body);
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #site-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-spinner {
      width: 52px;
      height: 52px;
      border: 4px solid var(--border-color);
      border-top-color: var(--primary);
      border-right-color: var(--solar-amber);
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Masonry / Pinterest Style Grid */
    .masonry-grid {
      column-count: 3;
      column-gap: 24px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 24px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
    }
    .masonry-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--primary);
    }
    @media (max-width: 992px) {
      .masonry-grid {
        column-count: 2;
      }
    }
    @media (max-width: 640px) {
      .masonry-grid {
        column-count: 1;
      }
    }

    /* Modern Card Layouts */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--card-shadow);
      transition: all var(--transition-normal);
    }
    .card:hover {
      box-shadow: var(--card-shadow-hover);
      border-color: rgba(59, 130, 246, 0.35);
      transform: translateY(-3px);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      transition: all var(--transition-fast);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }
    .btn-outline {
      border: 1px solid var(--border-color);
      color: var(--text-main);
      background: var(--bg-card);
    }
    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .btn-amber {
      background: var(--solar-amber);
      color: #0F172A;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .btn-amber:hover {
      background: var(--solar-amber-hover);
      transform: translateY(-1px);
    }

    /* Fixed Top Navigation Bar */
    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--nav-border);
      transition: all var(--transition-normal);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 19px;
      font-family: var(--font-heading);
      letter-spacing: -0.02em;
    }
    .nav-brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
    }
    .nav-brand-tagline {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      list-style: none;
    }
    .nav-link {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 4px;
      position: relative;
      transition: color var(--transition-fast);
    }
    .nav-link:hover, .nav-link.active {
      color: var(--primary);
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 18px;
      transition: all var(--transition-fast);
    }
    .theme-toggle-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Hamburger Button */
    .hamburger-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-main);
    }
    @media (max-width: 1040px) {
      .nav-links {
        display: none;
      }
      .hamburger-btn {
        display: flex;
      }
    }

    /* Mobile Drawer */
    .mobile-drawer {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .mobile-drawer.open {
      opacity: 1;
      visibility: visible;
    }
    .mobile-drawer-content {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 82%;
      max-width: 380px;
      background: var(--bg-surface);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
    }
    .mobile-drawer.open .mobile-drawer-content {
      transform: translateX(0);
    }

    /* Interactive Particle Canvas Hero */
    .hero-wrapper {
      position: relative;
      padding-top: 140px;
      padding-bottom: 90px;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                  radial-gradient(circle at 10% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
      border-bottom: 1px solid var(--border-color);
    }
    #hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }

    /* Statistics Counter Section */
    .stats-strip {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 48px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }
    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 480px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
    .stat-card {
      text-align: center;
      padding: 16px;
    }
    .stat-number {
      font-size: 42px;
      font-weight: 900;
      font-family: var(--font-heading);
      color: var(--primary);
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Accordion FAQ */
    .accordion-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color var(--transition-fast);
    }
    .accordion-item:hover {
      border-color: var(--primary);
    }
    .accordion-header {
      width: 100%;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .accordion-content {
      padding: 0 24px 20px 24px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* Testimonials Carousel */
    .carousel-container {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 48px;
      box-shadow: var(--card-shadow);
    }
    @media (max-width: 768px) {
      .carousel-container {
        padding: 28px 20px;
      }
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backdrop-filter: blur(6px);
    }
    .lightbox-modal {
      max-width: 900px;
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Back to Top & Sticky CTA */
    .back-to-top {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: all var(--transition-fast);
    }
    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .sticky-cta-btn {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      background: #25D366;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
      transition: transform var(--transition-fast);
    }
    .sticky-cta-btn:hover {
      transform: scale(1.04);
    }
    @media (max-width: 640px) {
      .sticky-cta-btn {
        bottom: 20px;
        left: 16px;
        padding: 10px 16px;
        font-size: 12px;
      }
      .back-to-top {
        bottom: 20px;
        right: 16px;
        width: 40px;
        height: 40px;
      }
    }

    /* Fat Footer */
    .fat-footer {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 80px 0 32px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.8fr;
      gap: 40px;
      margin-bottom: 50px;
    }
    @media (max-width: 992px) {
      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 640px) {
      .footer-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-focus);
    }
    .form-error {
      color: #EF4444;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Fade-in Animation utility */
    .fade-in-section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-in-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="site-preloader">
    <div class="preloader-spinner"></div>
    <div style="margin-top: 18px; font-weight: 800; font-family: 'Outfit', sans-serif; letter-spacing: -0.01em; color: var(--primary);">
      MaxEco Energy &amp; Tech
    </div>
    <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
      Guwahati, Assam • Initializing Clean Energy OS...

    function InteractiveHeroCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animationFrameId;

        let width = canvas.width = canvas.parentElement.offsetWidth;
        let height = canvas.height = canvas.parentElement.offsetHeight;

        const handleResize = () => {
          width = canvas.width = canvas.parentElement.offsetWidth;
          height = canvas.height = canvas.parentElement.offsetHeight;
        };
        window.addEventListener("resize", handleResize);

        // Interactive mouse point
        const mouse = { x: null, y: null, radius: 140 };
        const onMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };
        const onMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };
        canvas.addEventListener("mousemove", onMouseMove);
        canvas.addEventListener("mouseleave", onMouseLeave);

        // Initialize Particles
        const particleCount = Math.min(65, Math.floor((width * height) / 14000));
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            radius: Math.random() * 2.2 + 1.2,
            color: Math.random() > 0.4 ? "#3B82F6" : "#10B981"
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Update & Draw Particles
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            // Mouse repulsion/interaction
            if (mouse.x !== null && mouse.y !== null) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                p.x -= (dx / dist) * force * 2.5;
                p.y -= (dy / dist) * force * 2.5;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 0.6;
            ctx.fill();

            // Connect nearby particles with energy lines
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = p.color;
                ctx.globalAlpha = (1 - dist / 110) * 0.22;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener("resize", handleResize);
          canvas.removeEventListener("mousemove", onMouseMove);
          canvas.removeEventListener("mouseleave", onMouseLeave);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas id="hero-canvas" ref={canvasRef} />;
    }

    // 4. ANIMATED STATISTICS COUNTER COMPONENT
    // =========================================================================

    function AnimatedStats() {
      const [counted, setCounted] = useState(false);
      const sectionRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setCounted(true);
            observer.disconnect();
          }
        }, { threshold: 0.3 });

        if (sectionRef.current) observer.observe(sectionRef.current);
        return () => observer.disconnect();
      }, []);

      return (
        <section className="stats-strip" ref={sectionRef}>
          <div className="container">
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-number">{counted ? "120+" : "0"} <span style={{ fontSize: "24px" }}>kWp</span></div>
